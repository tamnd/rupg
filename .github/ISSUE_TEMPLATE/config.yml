blank_issues_enabled: false
contact_links:
  - name: Security problem
    url: https://github.com/tamnd/rupg/security/advisories/new
    about: Report a vulnerability in private. Do not open a public issue.
  - name: Question or idea
    url: https://github.com/tamnd/rupg/discussions
    about: Ask a question or discuss an idea before you open an issue.
  - name: Compatibility suites
    url: https://github.com/tamnd/rupg-compat/issues
    about: A problem in the oracles, the runner or the suites themselves.
  - name: Benchmarks
    url: https://github.com/tamnd/rupg-bench/issues
    about: A problem in the benchmark harness or a published number.
