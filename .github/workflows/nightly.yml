# The slow checks. They run each night on main and on request. They are not required for a merge.
#
# The sanitizers and Miri need the nightly toolchain. The main workspace stays on the pinned stable toolchain.

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src
      # The sanitizers need the standard library built with the same flags, so this uses -Zbuild-std.
      - name: cargo test
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          export RUSTFLAGS="-Zsanitizer=$SANITIZER -C target-cpu=x86-64-v3"
          export RUSTDOCFLAGS="-Zsanitizer=$SANITIZER"
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --lib --tests

  reproducible:
    name: reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same source must give the same binary. The second build is in a different directory with a different target directory, so a path in the binary shows as a difference. See .cargo/config.toml for SOURCE_DATE_EPOCH.
      - name: build two times and compare
        run: |
          set -euo pipefail
          cargo build --release --bin rupg
          sha256sum target/release/rupg > "$RUNNER_TEMP/first.sha256"
          cp -a . "$RUNNER_TEMP/second"
          cd "$RUNNER_TEMP/second"
          rm -rf target
          cargo build --release --bin rupg
          sha256sum target/release/rupg > "$RUNNER_TEMP/second.sha256"
          diff <(cut -d' ' -f1 "$RUNNER_TEMP/first.sha256") <(cut -d' ' -f1 "$RUNNER_TEMP/second.sha256")
          echo "the two builds are identical"

  macos:
    name: test on macos arm64
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The nightly part of the matrix in spec/21-testing.md section 21.16: clippy, T1 and T2 on macOS.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: rupg --print-config
        run: cargo run --bin rupg -- --print-config

  # T8 of spec/21 section 21.9: crash files from the M1 workload on the simulated disk. The per-change subset runs in cargo test. The 1 million file count of the M1 exit runs on request with a larger --files.
  crash:
    name: crash files
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each run starts at a new seed, so each night tries new crash files. The log gives the seed of a failure.
      - name: cargo run rupg-crash
        env:
          RUN: ${{ github.run_number }}
        run: cargo run --release -p rupg-crash -- --files 100000 --first-seed "$((RUN * 100000))"

  # The crash tests of spec/21 section 21.9.3 on real kernels: dm-log-writes on ext4 and XFS, SIGKILL, and LazyFS. See tests/realdisk/README.md.
  realdisk:
    name: real disk crash tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner kernel can have dm-log-writes in the extra modules package.
      - name: install the tools and load the modules
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq libfuse3-dev fuse3 xfsprogs cmake g++
          sudo modprobe dm-log-writes || { sudo apt-get install -yq "linux-modules-extra-$(uname -r)" && sudo modprobe dm-log-writes; }
          sudo modprobe dm-snapshot
      - name: build LazyFS 0.3.1
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch 0.3.1 https://github.com/dsrhaslab/lazyfs "$RUNNER_TEMP/lazyfs"
          test "$(git -C "$RUNNER_TEMP/lazyfs" rev-parse HEAD)" = 045a0b3a1126725e693934e29d3ba15e08cc39ec
          (cd "$RUNNER_TEMP/lazyfs/libs/libpcache" && ./build.sh)
          (cd "$RUNNER_TEMP/lazyfs/lazyfs" && ./build.sh)
      - name: cargo build rupg-crash
        run: cargo build --release -p rupg-crash
      # Each run starts at a new seed, so each night tries new workloads.
      - name: dm-log-writes on ext4 and XFS
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for fs in ext4 xfs; do
            sudo python3 tests/realdisk/logwrites.py --bin target/release/rupg-crash --fs "$fs" --work "$RUNNER_TEMP/lw-$fs" --seed "$RUN" --points 500
          done
      - name: SIGKILL
        env:
          RUN: ${{ github.run_number }}
        run: python3 tests/realdisk/kill.py --bin target/release/rupg-crash --work "$RUNNER_TEMP/kill" --first-seed "$((RUN * 1000))" --rounds 200
      - name: LazyFS
        env:
          RUN: ${{ github.run_number }}
        run: python3 tests/realdisk/kill.py --bin target/release/rupg-crash --work "$RUNNER_TEMP/lazyfs-run" --lazyfs "$RUNNER_TEMP/lazyfs/lazyfs/build/lazyfs" --first-seed "$((RUN * 1000))" --rounds 200

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [file_open, page_decode, log_replay, wire_frontend, wire_startup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      # Each target runs for 20 minutes. The corpus starts empty, and the fuzzer also reads fuzz/seeds/<target> if it exists. New inputs go into the empty corpus, so the seeds do not change. A panic, a hang over 1 second or memory over 2 GiB is a failure. See fuzz/README.md and spec/21-testing.md section 21.7.
      - name: cargo fuzz run
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly fuzz build -O -s none "$TARGET"
          mkdir -p "corpus/$TARGET"
          set -- "corpus/$TARGET"
          if [ -d "seeds/$TARGET" ]; then set -- "$@" "seeds/$TARGET"; fi
          cargo +nightly fuzz run -O -s none "$TARGET" "$@" -- -max_total_time=1200 -timeout=1 -rss_limit_mb=2048
      - name: upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  miri:
    name: miri
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly with miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      # Miri runs the library tests of the crates that may contain unsafe code. See xtask/unsafe.toml.
      - name: cargo miri test
        run: |
          set -euo pipefail
          crates=$(grep '^ *"' xtask/unsafe.toml | tr -d ' ",' | sed 's/^/-p /' | tr '\n' ' ')
          cargo +nightly miri setup
          # shellcheck disable=SC2086
          cargo +nightly miri test $crates --lib

  minimal-versions:
    name: minimal dependency versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal
      # The lower bounds in each Cargo.toml must build. A library user can get the oldest versions that the bounds allow.
      - name: cargo check with the oldest allowed versions
        run: |
          set -euo pipefail
          cargo +nightly update -Zdirect-minimal-versions
          cargo check --workspace --all-features --locked
