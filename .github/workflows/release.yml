# Build the rupg binary for each target, attest the build provenance, and publish a GitHub release.
#
# It runs on a tag v0.M.patch. The tag must match the workspace version and CHANGELOG.md must have a section for it.
#
# M1 shipped the first public API, so the 42 crates of crates/ are published to crates.io (spec/22-crate-layout.md section 22.13). crates.io trusted publishing works only for a crate that exists, so the first version of each crate is published by hand with a token. Then a publish job uses trusted publishing through OIDC, with no long-lived token.

name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "the tag $TAG gives $want, but Cargo.toml gives $have"
            exit 1
          fi
          grep -q "^## ${want}" CHANGELOG.md || { echo "CHANGELOG.md has no section for $want"; exit 1; }
          echo "release $have"
      # No cache in the release workflow. A cache from a pull request must not get into a release binary.
      - name: the checks of ci.yml
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo xtask layers
          cargo xtask style
          cargo xtask vendor --check
          cargo xtask grammar
          cargo xtask unicode --check
          cargo xtask errcodes --check
          cargo xtask pgtype --check
          cargo xtask guc --check
          cargo xtask tzdata --check
          cargo xtask waitevents --check
          cargo xtask encodings --check
          cargo xtask sql --check
          cargo xtask pgcatalog --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  build:
    name: build for ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-26, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, archive: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bin rupg --target "$TARGET"
      - name: make the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="rupg-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cp "target/$TARGET/release/rupg$exe" README.md LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      # Anyone can check an archive with: gh attestation verify <file> --repo tamnd/rupg
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: take the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v want="## ${TAG#v}" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
      # A person can make the release before this job ends. Then the job adds the files to it and keeps its notes.
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "rupg $TAG" --notes-file notes.md --verify-tag
          fi
