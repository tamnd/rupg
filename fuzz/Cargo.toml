[package]
name = "rupg-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# A separate workspace. cargo-fuzz needs the nightly toolchain, and the main workspace stays on the pinned stable toolchain. See spec/22-crate-layout.md section 22.2.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
rupg = { path = "../crates/rupg" }
rupg-buffer = { path = "../crates/rupg-buffer" }
rupg-common = { path = "../crates/rupg-common" }
rupg-file = { path = "../crates/rupg-file" }
rupg-log = { path = "../crates/rupg-log" }
rupg-platform = { path = "../crates/rupg-platform" }
rupg-wire = { path = "../crates/rupg-wire" }

[[bin]]
name = "file_open"
path = "fuzz_targets/file_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_decode"
path = "fuzz_targets/page_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_replay"
path = "fuzz_targets/log_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_frontend"
path = "fuzz_targets/wire_frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_startup"
path = "fuzz_targets/wire_startup.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
