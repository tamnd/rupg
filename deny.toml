# cargo-deny configuration. See spec/22-crate-layout.md sections 22.5 and 22.6.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Only permissive licenses. A copyleft license (GPL, LGPL, AGPL, MPL, SSPL, BSL) is not allowed in any crate that ships.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The list is the policy. A license that no dependency uses yet is not an error.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version wildcard problem.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
