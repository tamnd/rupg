# PostgreSQL names that are not in the dictionary of typos.
[default.extend-words]
brin = "brin"
RESERV = "RESERV"
IST = "IST"
# The fields `inh` of RangeVar and the others, and `larg` and `rarg` of SelectStmt and JoinExpr.
inh = "inh"
larg = "larg"
# A test of the parser gives `SELEC` for a syntax error.
selec = "selec"
# The `prosrc` of the casts `i2toi4` and `i4toi2`.
toi = "toi"

# Test inputs that are wrong on purpose.
[default]
extend-ignore-re = ['"infinit"', '"onn"']

[files]
# The catalog rows hold the names and descriptions of the vendored .dat files, such as `box_overright` and `dispell_init`.
extend-exclude = ["vendor/", "*.expected", "crates/rupg-types/tests/oracle.sql", "crates/rupg-types/tests/oracle.tsv", "crates/rupg-pgcatalog/src/generated/", "crates/rupg-pgcatalog/tests/oracle.tsv"]
