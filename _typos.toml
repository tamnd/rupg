# PostgreSQL names that are not in the dictionary of typos.
[default.extend-words]
brin = "brin"
RESERV = "RESERV"
IST = "IST"
# The fields `inh` of RangeVar and the others, and `larg` and `rarg` of SelectStmt and JoinExpr.
inh = "inh"
larg = "larg"
# A test of the parser gives `SELEC` for a syntax error.
selec = "selec"
# The `prosrc` of the casts `i2toi4` and `i4toi2`.
toi = "toi"
# The index `pg_amop_fam_strat_index` of `pg_amop`.
strat = "strat"
# The table `ser` of the test of the serial columns in `sequence.test`.
ser = "ser"
# The patterns `IY` and `iy` of `formatting.c`, the ordinal suffix `nd`, and the pattern `W` with the suffix `th` in the tests.
iy = "iy"
nd = "nd"
wth = "wth"

# Test inputs that are wrong on purpose.
[default]
# The strings `'hom'` and `caf\00e9` are inputs of the tests of overlay and unistr in `text_more.test`.
extend-ignore-re = ['"infinit"', '"onn"', "'hom'", 'caf\\00e9']

[files]
# The list of glibc encoding names in xml/encodings.rs has names such as `GOST_19768` and `CSISO16PORTUGESE`. The catalog rows hold the names and descriptions of the vendored .dat files, such as `box_overright` and `dispell_init`.
extend-exclude = ["vendor/", "*.expected", "crates/rupg-types/tests/oracle.sql", "crates/rupg-types/tests/oracle.tsv", "crates/rupg-pgcatalog/src/generated/", "crates/rupg-func/src/generated/", "crates/rupg-pgcatalog/tests/oracle.tsv", "crates/rupg-types/src/xml/encodings.rs"]
