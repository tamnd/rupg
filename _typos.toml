# PostgreSQL names that are not in the dictionary of typos.
[default.extend-words]
# The column alias `ba` of `generated_stored.sql`, which `gstored3.test` copies.
ba = "ba"
brin = "brin"
RESERV = "RESERV"
IST = "IST"
# The fields `inh` of RangeVar and the others, and `larg` and `rarg` of SelectStmt and JoinExpr.
inh = "inh"
larg = "larg"
# A test of the parser gives `SELEC` for a syntax error.
selec = "selec"
# The `prosrc` of the casts `i2toi4` and `i4toi2`.
toi = "toi"
# The index `pg_amop_fam_strat_index` of `pg_amop`.
strat = "strat"
# The table `ser` of the test of the serial columns in `sequence.test`.
ser = "ser"
# The patterns `IY` and `iy` of `formatting.c`, the ordinal suffix `nd`, and the pattern `W` with the suffix `th` in the tests.
iy = "iy"
nd = "nd"
wth = "wth"
# The fields `bra` and `ket` and the tables `amongs` of the Snowball runtime, and the functions `dispell_init` and `dispell_lexize` of the template `ispell`.
ket = "ket"
amongs = "amongs"
dispell = "dispell"
# The stems `fals` and `valu` of the English stemmer, and the word `abd` of the tests of the text search functions.
fals = "fals"
valu = "valu"
abd = "abd"
# The function `make_ands_implicit` of the planner.
ands = "ands"
# The operator families `alt_opf1` to `alt_opf19` of the test `alter_generic.sql` of PostgreSQL, in `opclass.test` and `opclass_alter.test`.
opf = "opf"
# The view `vview` of the test `rules.sql` of PostgreSQL, in `vrules2.test`.
vview = "vview"
# The view `sav` of the test of `= ANY` in a view definition, in `vsaop.test`.
sav = "sav"
# The partitioned table `pn` of the test of REPLICA IDENTITY, in `replica_identity_only.test`.
pn = "pn"

# Test inputs that are wrong on purpose.
[default]
# The strings `'hom'` and `caf\00e9` are inputs of the tests of overlay and unistr in `text_more.test`.
extend-ignore-re = ['"infinit"', '"onn"', "'hom'", 'caf\\00e9']

[files]
# The list of glibc encoding names in xml/encodings.rs has names such as `GOST_19768` and `CSISO16PORTUGESE`. The catalog rows hold the names and descriptions of the vendored .dat files, such as `box_overright` and `dispell_init`. The Snowball stemmers and their test words are in many languages. The ICU locales in pgcatalog/icu.rs have tags such as `fo-FO` and `vai`. The catalog statistics in pgcatalog/catalog_stats.rs copy the most common values of the oracle, such as `poly_overright` and `en-PN`. The copy of the time zone abbreviations of PostgreSQL in rupg-types has abbreviations such as `PONT` and `TAHT`.
extend-exclude = ["vendor/", "crates/rupg-types/src/generated/tznames_default.txt", "*.expected", "crates/rupg-types/tests/oracle.sql", "crates/rupg-types/tests/oracle.tsv", "crates/rupg-pgcatalog/src/generated/", "crates/rupg-func/src/generated/", "crates/rupg-pgcatalog/tests/oracle.tsv", "crates/rupg-types/src/xml/encodings.rs", "crates/rupg-snowball/src/algorithms/", "crates/rupg-snowball/tests/oracle.tsv", "crates/rupg-pgcatalog/src/icu.rs", "crates/rupg-pgcatalog/src/catalog_stats.rs"]
