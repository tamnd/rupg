[package]
name = "rupg"
description = "The Rust API, the facade crate that a user adds to Cargo.toml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish = false

[dependencies]
rupg-buffer.workspace = true
rupg-common.workspace = true
rupg-file.workspace = true
rupg-log.workspace = true
rupg-platform.workspace = true
rupg-server = { workspace = true, optional = true }
rupg-table.workspace = true
rupg-txn.workspace = true
rupg-types.workspace = true

[features]
# The PostgreSQL server: `rupg::server`.
server = ["dep:rupg-server", "tls"]
# TLS for the server with rustls and ring.
tls = ["rupg-server?/tls"]

[lints]
workspace = true
