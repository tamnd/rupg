# The host rules of the test.

local all all trust
local sameuser,"quoted db" +staff,alice ident map=local
host all all 127.0.0.1/32 scram-sha-256
host db1,db2 u1,"+notgroup" 10.0.0.0 255.0.0.0 md5
host all all ::1/128 trust
host all all 127.1 255.255.255.255 password
host replication all samehost reject
host all all samenet reject
host all all all reject
host all all .example.com password
host all all db.example.com trust
host samerole,samegroup all ::ffff:10.0.0.0/104 trust
host all all \
  192.168.0.0/16 \
  trust
hostssl all all 0.0.0.0/0 cert map=certmap
hostssl all all ::/0 scram-sha-256 clientcert=verify-ca
hostssl all all 10.1.0.0/16 trust clientcert=verify-full clientname=DN
hostnossl all all 10.2.0.0/16 reject
hostgssenc all all all trust
hostnogssenc all all all trust
include_if_exists missing.conf
hosts all all all trust
host all
host all all
host all all 10.0.0.0/33 trust
host all all name.example.com/8 trust
host all all 10.0.0.0 trust
host all all 10.0.0.0 ffff:: trust
host all all 10.0.0.0 bad trust
host all all 10.0.0.0/8
host all all 10.0.0.0/8 gss
host all all 10.0.0.0/8 magic
host all all 10.0.0.0/8 peer
host all all 10.0.0.0/8 cert
host all all 10.0.0.0/8 trust map
host all all 10.0.0.0/8 trust map=x
host all all 10.0.0.0/8 md5 nosuch=1
host all all 10.0.0.0/8 md5 ldapserver=x
host all all 10.0.0.0/8 trust clientcert=verify-full
hostssl all all 10.0.0.0/8 cert clientcert=verify-ca
hostssl all all 10.0.0.0/8 trust clientcert=maybe
host all all 10.0.0.0/8 oauth issuer=x
host all all 10.0.0.0/8 oauth issuer=x scope=y
host all,x all 10.0.0.0/8 trust
host /^db[0-9]$,"/quoted" /^u,+admins 10.0.0.0/8 trust
local "/(?i)abc" all trust
host all /( 10.0.0.0/8 trust
host /a[ all 10.0.0.0/8 trust
host all /a{2,1} 10.0.0.0/8 trust
local all /x\ trust
local all all trust
