[package]
name = "rupg-server"
description = "The listener, TLS, authentication, pg_hba.conf, the task per connection, cancel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish = false

# tls: TLS with rustls and ring, spec/22-crate-layout.md section 22.9. Without it, the setting `ssl` cannot be on.
[features]
tls = ["dep:ring", "dep:rustls"]

[dependencies]
ring = { workspace = true, optional = true }
rupg-common.workspace = true
rupg-platform.workspace = true
rupg-session.workspace = true
rupg-wire.workspace = true
rustls = { workspace = true, optional = true }

[dev-dependencies]
rustls.workspace = true

# The idle session test of spec/06 section 6.4.3. `cargo xtask idle` runs it.
[[example]]
name = "idle"
required-features = ["tls"]

[lints]
workspace = true
